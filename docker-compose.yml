version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cinevault_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=movie_library
    networks:
      - cinevault_net

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: cinevault_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/movie_library
      - JWT_SECRET=super_secret_jwt_key_movie_library_2026_docker
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - cinevault_net

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: cinevault_client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server
    networks:
      - cinevault_net

volumes:
  mongodb_data:
    driver: local

networks:
  cinevault_net:
    driver: bridge
